# AIDG Documenten bouwen: Euro-Office DesktopEditors (bron, ongewijzigd) +
# de AIDG-laag uit deze repo → Windows-installer → GitHub-release.
#
# Volgt de opbouw van de eigen CI van Euro-Office (.github/workflows/build.yml
# in Euro-Office/DesktopEditors): editors-inhoud ("common") op Linux, het
# programma op Windows, de merklaag als bestanden-boom over de checkout.
# Alleen het AIDG-merk, alleen Windows x64.
#
# Welke Euro-Office-versie: euro-office-ref.txt (een commit). De wekelijkse
# controle (controle.yml) zet die op de nieuwste commit die bij Euro-Office
# zelf groen bouwde, en start dan deze build.

name: Bouw AIDG Documenten

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Euro-Office-commit (leeg = euro-office-ref.txt)'
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'euro-office-ref.txt'
      - 'merk/**'
      - 'koppeling/**'
      - 'merk.py'
      - 'plugins.py'
      - '.github/workflows/bouw.yml'

concurrency:
  group: bouw
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/ischadegroot
  CACHE_IMAGE_NAME: aidg-documenten-cache
  BUILD_ROOT: /package
  PRODUCT_NAME: AIDG Documenten
  # Intern blijft het Euro-Office (installatiemap, register, hun geteste paden).
  COMPANY_NAME: Euro-Office

jobs:
  versie:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.v.outputs.ref }}
      product_version: ${{ steps.v.outputs.product_version }}
      build_number: ${{ steps.v.outputs.build_number }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          REF="${{ inputs.ref }}"
          [ -n "$REF" ] || REF="$(tr -d ' \r\n' < euro-office-ref.txt)"
          VER="$(curl -fsSL "https://raw.githubusercontent.com/Euro-Office/DesktopEditors/${REF}/VERSION.txt" | tr -d ' \r\n')"
          BN="aidg.${{ github.run_number }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "product_version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BN" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}-${BN}" >> "$GITHUB_OUTPUT"
          echo "Euro-Office $REF, versie $VER, build $BN"

  # De AIDG-laag: logo's/pictogrammen/namen (merk.py) en de AI-plugin met de
  # AIDG-koppeling (plugins.py). Eén keer, op Linux; de andere jobs pakken
  # het uit.
  merk:
    runs-on: ubuntu-latest
    needs: versie
    steps:
      - name: AIDG-laag (deze repo)
        uses: actions/checkout@v4
        with:
          path: aidg
      - name: Euro-Office (alleen de submodules met merkbestanden)
        run: |
          set -euo pipefail
          git init -q eo && cd eo
          git remote add origin https://github.com/Euro-Office/DesktopEditors.git
          git fetch -q --depth 1 origin "${{ needs.versie.outputs.ref }}"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --depth 1 desktop-apps web-apps
      - name: Euro-Office/plugins (alleen v1 en ai)
        run: |
          set -euo pipefail
          REF="$(tr -d ' \r\n' < aidg/plugins-ref.txt 2>/dev/null || echo master)"
          git clone -q --filter=blob:none --sparse https://github.com/Euro-Office/plugins.git plugins
          cd plugins && git checkout -q "$REF" && git sparse-checkout set sdkjs-plugins/v1 sdkjs-plugins/content/ai
          git log -1 --format='plugins: %H %cd'
      - name: Gereedschap
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core >/dev/null
          python3 -m pip install --quiet pillow cairosvg
      - name: Merklaag maken
        run: |
          set -euo pipefail
          python3 aidg/merk.py eo merklaag | tee merk.log
          if grep -q '^FOUT' merk.log; then echo "::error::merk.py meldde fouten"; exit 1; fi
          tar -czf merklaag.tar.gz -C merklaag .
      - name: AI-plugin met koppeling
        run: |
          set -euo pipefail
          python3 aidg/plugins.py plugins aiplugin
          tar -czf aiplugin.tar.gz -C aiplugin .
      - uses: actions/upload-artifact@v4
        with:
          name: aidg-laag
          path: |
            merklaag.tar.gz
            aiplugin.tar.gz
            merk.log
          retention-days: 14

  # Editors-inhoud (JS + WASM), met de merklaag erover. Zelfde bake als bij
  # Euro-Office, met eigen cache in ghcr.io/ischadegroot.
  common:
    runs-on: ubuntu-latest
    needs: [versie, merk]
    steps:
      - name: Euro-Office (met submodules)
        uses: actions/checkout@v4
        with:
          repository: Euro-Office/DesktopEditors
          ref: ${{ needs.versie.outputs.ref }}
          submodules: recursive
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: aidg-laag
          path: laag
      - name: Merklaag over de checkout
        run: tar -xzf laag/merklaag.tar.gz -C .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bouw desktop-common
        uses: docker/bake-action@v5
        with:
          workdir: ./build
          files: ./docker-bake.hcl
          targets: desktop-common
          push: false
          set: |
            *.context=..
            core-wasm.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:core-wasm
            core-wasm.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:core-wasm,mode=max
            core-wasm.tags=
            sdkjs-desktop.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:sdkjs-desktop
            sdkjs-desktop.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:sdkjs-desktop,mode=max
            sdkjs-desktop.tags=
            desktop-js.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:desktop-js
            desktop-js.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:desktop-js,mode=max
            desktop-js.tags=
            web-apps.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:web-apps
            web-apps.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:web-apps,mode=max
            web-apps.tags=
            desktop-common.tags=
            desktop-common.output=type=tar,dest=./common.tar
        env:
          GIT_COMMIT: ${{ needs.versie.outputs.ref }}
          PRODUCT_VERSION: ${{ needs.versie.outputs.product_version }}
          BUILD_NUMBER: ${{ needs.versie.outputs.build_number }}
          BUILD_ROOT: ${{ env.BUILD_ROOT }}
          NUGET_CACHE: local
          BRANDING_DIR: '.'
          COMPANY_NAME: ${{ env.COMPANY_NAME }}
          PRODUCT_NAME: ${{ env.PRODUCT_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: common
          path: ./build/common.tar
          compression-level: 0
          retention-days: 7

  windows:
    runs-on: windows-2022
    needs: [versie, merk, common]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Lange paden aan
        run: git config --system core.longpaths true
      - name: Euro-Office (met submodules)
        uses: actions/checkout@v4
        with:
          repository: Euro-Office/DesktopEditors
          ref: ${{ needs.versie.outputs.ref }}
          submodules: recursive
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: common
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: aidg-laag
          path: laag
      - name: Common uitpakken, met de AI-plugin erin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\common | Out-Null
          tar -xf .\common.tar -C .\common
          tar -xzf .\laag\aiplugin.tar.gz -C .\common
          Get-ChildItem .\common\editors\sdkjs-plugins | Select-Object Name
      - name: Merklaag over de checkout
        shell: bash
        run: tar -xzf laag/merklaag.tar.gz -C .
      - name: Cygwin
        uses: cygwin/cygwin-install-action@v4
        with:
          install-dir: 'C:\cygwin64'
          add-to-path: false
          packages: >-
            automake
            cmake
            make
            git
            python3
            python3-devel
      - name: aqtinstall
        shell: pwsh
        run: python -m pip install --upgrade --break-system-packages aqtinstall
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress
      - uses: lukka/run-vcpkg@v11
      # Bouwen in de gewone werkmap (CMake wil geen bouwmap op de wortel van
      # een schijf, en zo raakt sccache dezelfde paden als de vorige keer).
      - name: Bouwen
        shell: pwsh
        run: |
          .\build\windows\build.ps1 `
            -SkipPackaging `
            -CommonDir "${{ github.workspace }}\common" `
            -ProductVersion "${{ needs.versie.outputs.product_version }}" `
            -BuildNumber "${{ needs.versie.outputs.build_number }}" `
            -Arch x64 `
            -WinSdkVersion 10.0.19041.0 `
            -VcToolsVersion '' `
            -Target standalone `
            -CompanyName "${{ env.COMPANY_NAME }}" `
            -ProductName "${{ env.PRODUCT_NAME }}"
      # Verpakken vanaf een korte schijfletter: Inno Setup kan niet met paden
      # boven 260 tekens, en onze werkmap is langer dan die van Euro-Office
      # (sommige sjablonen hebben lange namen). Zelfde stappen als build.ps1.
      - name: Verpakken
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          subst X: "${{ github.workspace }}"
          Set-Location X:\desktop-apps\package
          . X:\build\windows\packaging-helpers.ps1
          $VersionFull = "${{ needs.versie.outputs.product_version }}.0"
          Save-VcRedist (Get-Location).Path x64
          .\make.ps1 -Version $VersionFull -Arch x64 -Target standalone `
            -CompanyName "${{ env.COMPANY_NAME }}" -ProductName "${{ env.PRODUCT_NAME }}" `
            -SourceDir X:\desktopeditors
          Assert-LastExit "make.ps1"
          $env:PATH = "C:\Program Files\7-Zip;$env:PATH"
          .\make_zip.ps1 -Version $VersionFull -Arch x64 -Target standalone
          Assert-LastExit "make_zip.ps1"
          $env:INNOPATH = Get-InnoRoot "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not $env:INNOPATH) { throw 'Inno Setup niet gevonden' }
          Sync-InnoLanguages (Join-Path $env:INNOPATH 'Languages')
          .\make_inno.ps1 -Version $VersionFull -Arch x64 -Target standalone
          Assert-LastExit "make_inno.ps1"
      - name: Wat er gemaakt is
        shell: pwsh
        run: Get-ChildItem desktop-apps\package -Recurse -Include *.exe,*.zip,*.msi | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop-apps/package/inno/*.exe
            desktop-apps/package/zip/*.zip
          if-no-files-found: error
          retention-days: 14

  # Ongetekend gepubliceerd (zoals Euro-Office zelf ook doet); de AIDG-app
  # controleert de SHA-256 uit SHA256SUMS.txt voordat hij installeert.
  release:
    runs-on: ubuntu-latest
    needs: [versie, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: uit
      - name: Release maken
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd uit
          find . -type f \( -name '*.exe' -o -name '*.zip' \) -exec mv {} . \;
          ls -la
          INSTALLER="$(ls *.exe | head -1)"
          cp "$INSTALLER" "AIDG-Documenten-${{ needs.versie.outputs.product_version }}-x64.exe"
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > notes.md <<EOF
          AIDG Documenten ${{ needs.versie.outputs.product_version }} (${{ needs.versie.outputs.build_number }}).

          Gebouwd uit Euro-Office DesktopEditors, commit \`${{ needs.versie.outputs.ref }}\`
          (https://github.com/Euro-Office/DesktopEditors/tree/${{ needs.versie.outputs.ref }}),
          met de AIDG-laag uit deze repo (commit ${{ github.sha }}). AGPL-3.0.
          EOF
          gh release create "${{ needs.versie.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "AIDG Documenten ${{ needs.versie.outputs.product_version }} (${{ needs.versie.outputs.build_number }})" \
            --notes-file notes.md \
            "AIDG-Documenten-${{ needs.versie.outputs.product_version }}-x64.exe" *.zip SHA256SUMS.txt
