# Wekelijks: heeft Euro-Office een nieuwere RELEASE (tag vX.Y.Z of vX.Y.Z-N, geen rc)?
# Dan die vastzetten in euro-office-ref.txt (en de nieuwste plugin-release in
# plugins-ref.txt) en AIDG Documenten bouwen. Nooit main: een tussenstand van main
# gaf 09-10-2026 een office die vastliep en ouder oogde dan online.
# Zo volgen we hun updates zonder iets met de hand te doen; alleen de
# AIDG-laag (deze repo) wordt erover gelegd.

name: Euro-Office-updates

on:
  schedule:
    - cron: '17 3 * * 1'   # maandag 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  kijk:
    runs-on: ubuntu-latest
    outputs:
      nieuw: ${{ steps.k.outputs.nieuw }}
      ref: ${{ steps.k.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: k
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Nieuwste release-tag van een repo als "<tag> <sha>" (geen rc, geen main).
          nieuwste() {
            gh api "repos/Euro-Office/$1/tags?per_page=100" --jq '.[] | "\(.name) \(.commit.sha)"' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)? ' | sort -V | tail -1
          }
          HUIDIG="$(tr -d ' \r\n' < euro-office-ref.txt)"
          read -r TAG NIEUW <<< "$(nieuwste DesktopEditors)"
          read -r PTAG PNIEUW <<< "$(nieuwste plugins)"
          echo "huidig: $HUIDIG"
          echo "nieuwste release: $TAG $NIEUW (plugins $PTAG $PNIEUW)"
          if [ -z "$NIEUW" ] || [ "$NIEUW" = "$HUIDIG" ]; then
            echo "nieuw=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$NIEUW" > euro-office-ref.txt
          if [ -n "$PNIEUW" ]; then echo "$PNIEUW" > plugins-ref.txt; fi
          git config user.name "aidg-bouw"
          git config user.email "aidg-bouw@users.noreply.github.com"
          git commit -qam "Euro-Office ${NIEUW:0:8}"
          git push -q
          echo "nieuw=true" >> "$GITHUB_OUTPUT"
          echo "ref=$NIEUW" >> "$GITHUB_OUTPUT"

  bouw:
    needs: kijk
    if: needs.kijk.outputs.nieuw == 'true'
    uses: ./.github/workflows/bouw.yml
    with:
      ref: ${{ needs.kijk.outputs.ref }}
    secrets: inherit
