# Wekelijks: is er bij Euro-Office een nieuwere commit die bij hen zelf groen
# bouwde? Dan die vastzetten in euro-office-ref.txt en AIDG Documenten bouwen.
# Zo volgen we hun updates zonder iets met de hand te doen; alleen de
# AIDG-laag (deze repo) wordt erover gelegd.

name: Euro-Office-updates

on:
  schedule:
    - cron: '17 3 * * 1'   # maandag 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  kijk:
    runs-on: ubuntu-latest
    outputs:
      nieuw: ${{ steps.k.outputs.nieuw }}
      ref: ${{ steps.k.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: k
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HUIDIG="$(tr -d ' \r\n' < euro-office-ref.txt)"
          # Nieuwste push op main waarvan de build bij Euro-Office slaagde.
          NIEUW="$(gh api "repos/Euro-Office/DesktopEditors/actions/workflows/build.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha')"
          echo "huidig: $HUIDIG"
          echo "nieuwste groene: $NIEUW"
          if [ -z "$NIEUW" ] || [ "$NIEUW" = "$HUIDIG" ]; then
            echo "nieuw=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$NIEUW" > euro-office-ref.txt
          git config user.name "aidg-bouw"
          git config user.email "aidg-bouw@users.noreply.github.com"
          git commit -qam "Euro-Office ${NIEUW:0:8}"
          git push -q
          echo "nieuw=true" >> "$GITHUB_OUTPUT"
          echo "ref=$NIEUW" >> "$GITHUB_OUTPUT"

  bouw:
    needs: kijk
    if: needs.kijk.outputs.nieuw == 'true'
    uses: ./.github/workflows/bouw.yml
    with:
      ref: ${{ needs.kijk.outputs.ref }}
    secrets: inherit
